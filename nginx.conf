server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular's own build hashes filenames for JS/CSS (outputHashing: "all"
    # in angular.json's production config), so those are safe to cache
    # aggressively — a new deploy always ships new filenames.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must never be cached, since it's the one file whose
    # *content* changes on every deploy without its filename changing.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any path Angular's router owns (e.g. /equipment,
    # /inventory/items/42) isn't a real file on disk, so hand every unmatched
    # request to index.html and let the client-side router take it from there.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
