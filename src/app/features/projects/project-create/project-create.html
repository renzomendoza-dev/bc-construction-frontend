<div class="create-page">

  <button type="button" class="back-btn" (click)="backToList()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"></path>
      <path d="m12 19-7-7 7-7"></path>
    </svg>
    Back to Projects
  </button>

  <div class="create-page__title">New Project</div>

  @if (errorMessage()) {
    <div class="form-error">{{ errorMessage() }}</div>
  }

  <div class="card">
    <div class="form-grid">
      <div class="form-field">
        <label>Code *</label>
        <input type="text" placeholder="e.g. PRJ-2026-001" [value]="code()" (change)="onCodeChange($any($event.target).value)" />
      </div>
      <div class="form-field">
        <label>Name *</label>
        <input type="text" placeholder="e.g. Sta. Maria Warehouse Expansion" [value]="name()" (change)="onNameChange($any($event.target).value)" />
      </div>
      <div class="form-field">
        <label>Budget</label>
        <input type="text" placeholder="e.g. 2500000" [value]="budget()" (change)="onBudgetChange($any($event.target).value)" />
      </div>
      <div class="form-field">
        <label>Start Date *</label>
        <input type="date" [value]="startDate()" (change)="onStartDateChange($any($event.target).value)" />
      </div>
      <div class="form-field">
        <label>End Date</label>
        <input type="date" [value]="endDate()" (change)="onEndDateChange($any($event.target).value)" />
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card__title">Description</div>
    <textarea placeholder="Optional description of this project…" [value]="description()" (change)="onDescriptionChange($any($event.target).value)"></textarea>
  </div>

  <div class="form-actions">
    <button type="button" class="btn-primary" [disabled]="saving()" (click)="createProject()">
      {{ saving() ? 'Creating…' : 'Create Project' }}
    </button>
    <button type="button" class="btn-secondary" [disabled]="saving()" (click)="backToList()">Cancel</button>
  </div>

</div>
