<div class="create-page">

  <button type="button" class="back-btn" (click)="backToList()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"></path>
      <path d="m12 19-7-7 7-7"></path>
    </svg>
    Back to Material Requests
  </button>

  <div class="create-page__title">New Material Request</div>

  @if (errorMessage()) {
    <div class="form-error">{{ errorMessage() }}</div>
  }

  <div class="card">
    <div class="form-grid">
      <div class="form-field">
        <label>Site *</label>
        <select [value]="siteWarehouseId()" (change)="onSiteChange($any($event.target).value)">
          <option value="">Select a site…</option>
          @for (s of sites(); track s.id) {
            <option [value]="s.id">{{ s.name }}</option>
          }
        </select>
      </div>
      <div class="form-field">
        <label>Date Needed</label>
        <input type="date" [value]="dateNeeded()" (change)="onDateNeededChange($any($event.target).value)" />
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card__title">Line Items</div>

    <div class="lines-head">
      <div>Item</div>
      <div class="align-right">Quantity *</div>
      <div>Notes</div>
      <div></div>
    </div>

    @for (line of lines(); track $index) {
      <div class="lines-row">
        <select (change)="onLineItemChange($index, $any($event.target).value)">
          <option value="">Select item…</option>
          @for (item of items(); track item.id) {
            <option [value]="item.id">{{ item.name }} ({{ item.sku }})</option>
          }
        </select>
        <input type="number" min="1" class="align-right" (change)="onLineQtyChange($index, $any($event.target).value)" />
        <input type="text" placeholder="optional" (change)="onLineNotesChange($index, $any($event.target).value)" />
        <button type="button" class="line-remove" [disabled]="lines().length <= 1" (click)="removeLine($index)" aria-label="Remove line">✕</button>
      </div>
    }

    <button type="button" class="btn-add-line" (click)="addLine()">+ Add Line</button>

    <div class="lines-total">
      <span class="lines-total__label">Total Items Requested</span>
      <span class="lines-total__value">{{ totalItemCount() }}</span>
    </div>
  </div>

  <div class="card">
    <div class="card__title">Notes</div>
    <textarea placeholder="Optional notes about this request…" (change)="onNotesChange($any($event.target).value)"></textarea>
  </div>

  <div class="form-actions">
    <button type="button" class="btn-primary" [disabled]="saving() || loadingOptions()" (click)="createRequest()">
      {{ saving() ? 'Creating…' : 'Create Request' }}
    </button>
    <button type="button" class="btn-secondary" [disabled]="saving()" (click)="backToList()">Cancel</button>
  </div>

</div>
