<div class="item-detail-page">

  <button type="button" class="back-btn" (click)="backToList()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"></path>
      <path d="m12 19-7-7 7-7"></path>
    </svg>
    Back to Items
  </button>

  <div class="item-detail-header">
    <div>
      <div class="item-detail-header__title-row">
        <div class="item-detail-header__title">New Item</div>
      </div>
      <div class="item-detail-header__sku">Images and linked suppliers can be added after the item is created.</div>
    </div>
  </div>

  <div class="detail-grid detail-grid--single">
    <div class="card">
      <div class="card__title">Details</div>

      @if (errorMessage()) {
        <div class="form-error">{{ errorMessage() }}</div>
      }

      <div class="form-grid">
        <div class="form-field">
          <label for="item-sku">SKU *</label>
          <input id="item-sku"
            type="text"
            [value]="form().sku"
            (change)="onSkuChange($any($event.target).value)"
            [class.form-field--invalid]="fieldErrors()['sku']"
          />
          @if (fieldErrors()['sku']) {
            <div class="field-error">{{ fieldErrors()['sku'] }}</div>
          }
        </div>

        <div class="form-field">
          <label for="item-name">Name *</label>
          <input id="item-name"
            type="text"
            [value]="form().name"
            (change)="onNameChange($any($event.target).value)"
            [class.form-field--invalid]="fieldErrors()['name']"
          />
          @if (fieldErrors()['name']) {
            <div class="field-error">{{ fieldErrors()['name'] }}</div>
          }
        </div>

        <div class="form-field">
          <label for="item-category">Category</label>
          <input id="item-category"
            type="text"
            list="category-options"
            placeholder="e.g. Cement, Steel, Lumber…"
            [value]="form().category"
            (change)="onCategoryChange($any($event.target).value)"
          />
          <datalist id="category-options">
            @for (cat of categoryOptions(); track cat) {
              <option [value]="cat"></option>
            }
          </datalist>
        </div>

        <div class="form-field">
          <label for="item-unit-of-measure">Unit of Measure</label>
          <input id="item-unit-of-measure" type="text" placeholder="e.g. pcs, box, sheet" [value]="form().unitOfMeasure" (change)="onUnitChange($any($event.target).value)" />
        </div>

        <div class="form-field">
          <label for="item-selling-price">Selling Price</label>
          <input id="item-selling-price" type="number" step="0.01" min="0" [value]="form().sellingPrice" (change)="onPriceChange($any($event.target).value)" />
        </div>

        <div class="form-field">
          <label for="item-default-cost-price">Default Cost Price</label>
          <input id="item-default-cost-price" type="number" step="0.01" min="0" [value]="form().defaultCostPrice" (change)="onCostChange($any($event.target).value)" />
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-primary" [disabled]="saving()" (click)="createItem()">
          {{ saving() ? 'Creating…' : 'Create Item' }}
        </button>
        <button type="button" class="btn-secondary" [disabled]="saving()" (click)="backToList()">Cancel</button>
      </div>
    </div>
  </div>

</div>
