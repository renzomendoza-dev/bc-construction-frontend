<div class="create-page">

  <button type="button" class="back-btn" (click)="backToList()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"></path>
      <path d="m12 19-7-7 7-7"></path>
    </svg>
    Back to Purchase Receipts
  </button>

  <div class="create-page__title">New Purchase Receipt</div>

  @if (errorMessage()) {
    <div class="form-error">{{ errorMessage() }}</div>
  }

  <div class="card">
    <div class="form-grid">
      <div class="form-field">
        <label>Supplier *</label>
        <select (change)="onSupplierChange($any($event.target).value)">
          <option value="">Select a supplier…</option>
          @for (s of suppliers(); track s.id) {
            <option [value]="s.id">{{ s.name }}</option>
          }
        </select>
      </div>
      <div class="form-field">
        <label>Warehouse *</label>
        <select (change)="onWarehouseChange($any($event.target).value)">
          <option value="">Select a warehouse…</option>
          @for (w of warehouses(); track w.id) {
            <option [value]="w.id">{{ w.name }}</option>
          }
        </select>
      </div>
      <div class="form-field">
        <label>Receipt Number</label>
        <input type="text" placeholder="e.g. INV-2026-00842" (change)="onReceiptNumberChange($any($event.target).value)" />
      </div>
      <div class="form-field">
        <label>Purchase Date *</label>
        <input type="date" [value]="purchaseDate()" (change)="onPurchaseDateChange($any($event.target).value)" />
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card__title">Line Items</div>

    <div class="lines-head">
      <div>Item</div>
      <div class="align-right">Qty</div>
      <div class="align-right">Unit Cost</div>
      <div class="align-right">Line Total</div>
      <div></div>
    </div>

    @for (line of lines(); track $index) {
      <div class="lines-row">
        <select (change)="onLineItemChange($index, $any($event.target).value)">
          <option value="">Select item…</option>
          @for (item of items(); track item.id) {
            <option [value]="item.id">{{ item.name }} ({{ item.sku }})</option>
          }
        </select>
        <input type="number" min="1" class="align-right" (change)="onLineQtyChange($index, $any($event.target).value)" />
        <input type="number" min="0" step="0.01" class="align-right" (change)="onLineCostChange($index, $any($event.target).value)" />
        <div class="align-right lines-row__total">{{ formatPeso(lineTotal(line)) }}</div>
        <button type="button" class="line-remove" [disabled]="lines().length <= 1" (click)="removeLine($index)" aria-label="Remove line">✕</button>
      </div>
    }

    <button type="button" class="btn-add-line" (click)="addLine()">+ Add Line</button>

    <div class="lines-total">
      <span class="lines-total__label">Total Amount</span>
      <span class="lines-total__value">{{ formatPeso(total()) }}</span>
    </div>
  </div>

  <div class="card">
    <div class="card__title">Notes</div>
    <textarea placeholder="Optional notes about this purchase…" (change)="onNotesChange($any($event.target).value)"></textarea>
  </div>

  <div class="form-actions">
    <button type="button" class="btn-primary" [disabled]="saving() || loadingOptions()" (click)="createReceipt()">
      {{ saving() ? 'Creating…' : 'Create Receipt' }}
    </button>
    <button type="button" class="btn-secondary" [disabled]="saving()" (click)="backToList()">Cancel</button>
  </div>

</div>
