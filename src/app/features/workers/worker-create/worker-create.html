<div class="create-page">

  <button type="button" class="back-btn" (click)="backToList()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"></path>
      <path d="m12 19-7-7 7-7"></path>
    </svg>
    Back to Workers
  </button>

  <div class="create-page__title">New Worker</div>

  @if (errorMessage()) {
    <div class="form-error">{{ errorMessage() }}</div>
  }

  <div class="card">
    <div class="form-grid">
      <div class="form-field">
        <label>Name *</label>
        <input type="text" placeholder="e.g. Ramon Villanueva" [value]="name()" (change)="onNameChange($any($event.target).value)" />
      </div>
      <div class="form-field">
        <label>Position</label>
        <input type="text" placeholder="e.g. Mason" [value]="position()" (change)="onPositionChange($any($event.target).value)" />
      </div>
      <div class="form-field">
        <label>Daily Rate (PHP) *</label>
        <input type="number" min="0" step="0.01" placeholder="e.g. 750" [value]="dailyRate()" (change)="onDailyRateChange($any($event.target).value)" />
      </div>
    </div>
  </div>

  <div class="form-actions">
    <button type="button" class="btn-primary" [disabled]="saving()" (click)="createWorker()">
      {{ saving() ? 'Adding…' : 'Add Worker' }}
    </button>
    <button type="button" class="btn-secondary" [disabled]="saving()" (click)="backToList()">Cancel</button>
  </div>

</div>
