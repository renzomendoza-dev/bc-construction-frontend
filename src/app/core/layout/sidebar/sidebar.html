<aside class="sidebar">

  <div class="sidebar__header">
    <div class="sidebar__logo">
      <img src="/images/logo.png" alt="BC Construction Services" class="sidebar__logo-img" />
    </div>
    @if (expanded()) {
      <div class="sidebar__title">BC Construction<br />Services</div>
    }
  </div>

  <nav class="sidebar__nav">

    <a
      routerLink="/dashboard"
      routerLinkActive="is-active"
      class="nav-item"
    >
      <svg class="nav-item__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5 12 3l9 7.5"></path>
        <path d="M5 9.5V21h14V9.5"></path>
        <path d="M9.5 21v-6h5v6"></path>
      </svg>
      @if (expanded()) {
        <span class="nav-item__label">Dashboard</span>
      }
    </a>

    <div class="nav-group">
      <button
        type="button"
        class="nav-item nav-item--button"
        (click)="toggleInventory()"
      >
        <svg class="nav-item__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 8 12 3 3 8l9 5 9-5Z"></path>
          <path d="M3 8v8l9 5 9-5V8"></path>
          <path d="M12 13v8"></path>
        </svg>
        @if (expanded()) {
          <span class="nav-item__label nav-item__label--flex">Inventory</span>
          <svg
            class="nav-group__chevron"
            [class.nav-group__chevron--open]="inventoryOpen()"
            width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
          >
            <path d="M9 18l6-6-6-6"></path>
          </svg>
        }
      </button>

      @if (showInventorySub()) {
        <div class="nav-subgroup">
          @for (item of inventoryRoutes; track item.path) {
            <a
              [routerLink]="item.path"
              routerLinkActive="is-active"
              class="nav-subitem"
            >{{ item.label }}</a>
          }
        </div>
      }
    </div>

    <div class="nav-item nav-item--disabled" aria-disabled="true">
      <svg class="nav-item__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3v18h18"></path>
        <path d="M7 15l4-5 3 3 5-6"></path>
      </svg>
      @if (expanded()) {
        <span class="nav-item__label nav-item__label--flex">Sales</span>
        <span class="nav-badge">Soon</span>
      }
    </div>

  </nav>

  <div class="sidebar__footer">
    @if (expanded()) {
      <div class="sidebar__footer-label">Admin</div>
    }

    <a
      routerLink="/users"
      routerLinkActive="is-active"
      class="nav-item"
    >
      <svg class="nav-item__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      @if (expanded()) {
        <span class="nav-item__label">Users</span>
      }
    </a>

    <button
      type="button"
      class="collapse-btn"
      [class.collapse-btn--collapsed]="!expanded()"
      (click)="toggleCollapse()"
    >
      <svg
        class="collapse-btn__icon"
        [class.collapse-btn__icon--collapsed]="!expanded()"
        width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      >
        <path d="M11 17l-5-5 5-5"></path>
        <path d="M18 17l-5-5 5-5"></path>
      </svg>
      @if (expanded()) {
        <span>Collapse</span>
      }
    </button>
  </div>

  <button type="button" class="theme-toggle" (click)="toggleTheme()">
    <span class="theme-toggle__icon">{{ isDark() ? '☾' : '☀' }}</span>
    {{ isDark() ? 'Dark' : 'Light' }}
  </button>

</aside>
